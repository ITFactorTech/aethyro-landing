<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Sign up — Aethyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./style.css"/>
<style>
.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--t3);font-size:.78rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b2)}
.btn-oauth{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--b2);box-shadow:none;gap:.55rem;margin-top:0}
.btn-oauth:hover{background:rgba(255,255,255,.09)}
.btn-magic{background:transparent;color:var(--t2);border:1px solid var(--b2);box-shadow:none;gap:.5rem;margin-top:0;font-size:.88rem}
.btn-magic:hover{background:rgba(255,255,255,.05);color:var(--text)}
</style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BE319Z71PD"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-BE319Z71PD');</script>
</head>
<body>
<div class="wrap">
  <a href="/" class="brand"><span class="dot"></span> Aethyro</a>
  <div class="card">
    <h1>Get 200 free credits</h1>
    <p class="sub">No credit card required. Powered by Claude Opus 5.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email"/>
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="8" placeholder="at least 8 characters" autocomplete="new-password"/>
      <button class="btn" id="submit" type="submit">Create account →</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-oauth" id="githubBtn" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
      Sign up with GitHub
    </button>
    <div class="divider">or</div>
    <button class="btn btn-magic" id="magicBtn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
      Sign up with magic link
    </button>
    <div class="msg" id="msg"></div>
    <p class="alt">Already have an account? <a href="./login.html" id="loginAlt">Log in</a></p>
  </div>
  <p class="note">// 200 credits granted on signup · credits never expire · no data sold</p>
</div>
<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('submit'), form=document.getElementById('form');
  function show(t,kind){ msg.textContent=t; msg.className='msg show '+kind; }
  if(!window.AETHYRO){ show(window.AETHYRO_LOADERR||'app failed to load','err'); return; }
  var supabase=window.AETHYRO.supabase;
  var nextParam = new URLSearchParams(location.search).get('next');
  var nextUrl = nextParam==='chat' ? './chat.html' : './dashboard.html';
  if(nextParam) document.getElementById('loginAlt').href='./login.html?next='+encodeURIComponent(nextParam);

  document.getElementById('githubBtn').addEventListener('click', async function(){
    var redirectTo=window.location.origin+(nextParam==='chat' ? '/app/chat.html' : '/app/dashboard.html');
    var r=await supabase.auth.signInWithOAuth({provider:'github',options:{redirectTo:redirectTo}});
    if(r.error) show(r.error.message,'err');
  });

  document.getElementById('magicBtn').addEventListener('click', async function(){
    var email=document.getElementById('email').value.trim();
    if(!email){ document.getElementById('email').focus(); show('Enter your email address above first.','err'); return; }
    var magicBtn=document.getElementById('magicBtn');
    magicBtn.disabled=true; magicBtn.textContent='Sending…'; msg.className='msg';
    var redirectTo=window.location.origin+(nextParam==='chat' ? '/app/chat.html' : '/app/dashboard.html');
    var r=await supabase.auth.signInWithOtp({ email:email, options:{ emailRedirectTo:redirectTo } });
    if(r.error){ show(r.error.message,'err'); magicBtn.disabled=false; magicBtn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg> Sign up with magic link'; return; }
    if(typeof gtag!=='undefined'){ gtag('event','sign_up',{method:'magic_link', source: nextParam==='chat' ? 'chat_trial' : 'direct'}); }
    show('Magic link sent — check your inbox. Clicking it creates your account and grants 200 free credits.','ok');
    magicBtn.textContent='Link sent ✓';
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault(); btn.disabled=true; btn.textContent='Creating…'; msg.className='msg';
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    try{
      var confirmUrl=window.location.origin+'/app/confirm.html'+(nextParam ? '?next='+encodeURIComponent(nextParam) : '');
      var r=await supabase.auth.signUp({ email:email, password:password, options:{ emailRedirectTo:confirmUrl } });
      if(r.error){ show(r.error.message,'err'); btn.disabled=false; btn.textContent='Create account →'; return; }
      if(typeof gtag!=='undefined'){ gtag('event','sign_up',{method:'email', source: nextParam==='chat' ? 'chat_trial' : 'direct'}); gtag('event','begin_checkout',{currency:'USD',value:0}); }
      if(r.data && r.data.session){ location.href=nextUrl; return; }
      show('Account created — check your email to confirm, then log in to claim your 200 free credits.','ok'); btn.textContent='Check your email ✓';
    }catch(err){ show((err&&err.message)||String(err),'err'); btn.disabled=false; btn.textContent='Create account & start trial →'; }
  });
})();
</script>
</body>
</html>
