<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Log in — Aethyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./style.css"/>
<style>
.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--t3);font-size:.78rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b2)}
.btn-google{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--b2);box-shadow:none;gap:.55rem;margin-top:0}
.btn-google:hover{background:rgba(255,255,255,.09)}
</style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BE319Z71PD"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-BE319Z71PD');</script>
</head>
<body>
<div class="wrap">
  <a href="/" class="brand"><span class="dot"></span> Aethyro</a>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your Aethyro account.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@company.com" autocomplete="email"/>
      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="your password" autocomplete="current-password"/>
      <button class="btn" id="submit" type="submit">Log in →</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-google" id="googleBtn" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div class="msg" id="msg"></div>
    <p class="alt">No account yet? <a href="./signup.html" id="signupAlt">Start a free trial</a></p>
    <p class="alt" style="margin-top:.5rem"><a href="./forgot.html" style="color:var(--t3);font-size:.82rem">Forgot password?</a></p>
  </div>
</div>
<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('submit'), form=document.getElementById('form');
  function show(t){ msg.textContent=t; msg.className='msg show err'; }
  if(!window.AETHYRO){ show(window.AETHYRO_LOADERR||'app failed to load'); return; }
  var supabase=window.AETHYRO.supabase;
  var nextParam = new URLSearchParams(location.search).get('next');
  var nextUrl = nextParam==='chat' ? './chat.html' : './dashboard.html';
  if(nextParam) document.getElementById('signupAlt').href='./signup.html?next='+encodeURIComponent(nextParam);
  supabase.auth.getSession().then(function(r){ if(r.data && r.data.session) location.href=nextUrl; });

  document.getElementById('googleBtn').addEventListener('click', async function(){
    var r=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+nextUrl}});
    if(r.error) show(r.error.message);
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault(); btn.disabled=true; btn.textContent='Logging in…'; msg.className='msg';
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    try{
      var r=await supabase.auth.signInWithPassword({ email:email, password:password });
      if(r.error){ show(r.error.message); btn.disabled=false; btn.textContent='Log in →'; return; }
      if(typeof gtag!=='undefined'){ gtag('event','login',{method:'email', source: nextParam==='chat' ? 'chat_trial' : 'direct'}); }
      location.href=nextUrl;
    }catch(err){ show((err&&err.message)||String(err)); btn.disabled=false; btn.textContent='Log in →'; }
  });
})();
</script>
</body>
</html>
