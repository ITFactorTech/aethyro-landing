<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Community — Aethyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./style.css"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BE319Z71PD"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-BE319Z71PD');</script>
<style>
  .f-wrap{max-width:820px;margin:0 auto;padding:2rem 1.25rem}
  .f-cats{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0 1.25rem}
  .f-cat{padding:.35rem .8rem;border:1px solid var(--b1);border-radius:100px;background:transparent;color:var(--t2);font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--font)}
  .f-cat.on{border-color:var(--orange);color:var(--orange);background:rgba(255,77,0,.07)}
  .f-thread{display:block;background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.6rem;cursor:pointer;transition:border-color .15s;text-decoration:none;color:inherit}
  .f-thread:hover{border-color:var(--b2)}
  .f-thread .tt{font-weight:700;color:var(--text);font-size:.95rem}
  .f-meta{font-family:var(--mono);font-size:.66rem;color:var(--t3);margin-top:.3rem;display:flex;gap:.8rem;flex-wrap:wrap}
  .f-pill{font-size:.6rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
  .post{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.6rem}
  .post .who{font-family:var(--mono);font-size:.68rem;color:var(--orange)}
  .post .when{font-family:var(--mono);font-size:.62rem;color:var(--t3);float:right}
  .post .bd{margin-top:.5rem;color:var(--t2);font-size:.9rem;line-height:1.6;white-space:pre-wrap}
  .post .acts{margin-top:.5rem;display:flex;gap:.8rem}
  .post .acts a{font-size:.66rem;color:var(--t3);cursor:pointer}
  .post .acts a:hover{color:var(--text)}
  textarea,select{width:100%;padding:.7rem .85rem;background:rgba(0,0,0,.4);border:1px solid var(--b2);border-radius:9px;color:var(--text);font-size:.9rem;font-family:var(--font);outline:none;resize:vertical}
  textarea:focus,select:focus{border-color:var(--orange)}
  .f-form{background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:1.4rem;margin-top:1.5rem}
  .f-form h3{font-size:.95rem;margin-bottom:.8rem}
  .row{display:flex;gap:.6rem;margin-bottom:.6rem}
  .row select{flex:0 0 180px}.row input{flex:1}
</style>
</head>
<body>
<div class="f-wrap">
  <div class="topbar">
    <a href="/" class="brand" style="margin:0"><span class="dot"></span> Aethyro</a>
    <div style="display:flex;gap:.6rem">
      <a href="/app/dashboard.html" class="btn btn-ghost" style="width:auto;margin:0;padding:.5rem 1rem">Dashboard</a>
      <button class="btn btn-ghost" id="signout" style="width:auto;margin:0;padding:.5rem 1rem">Sign out</button>
    </div>
  </div>
  <div id="loading" class="loading">loading community…</div>
  <div id="view" style="display:none"></div>
</div>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function fail(m){var l=$('loading');if(l){l.innerHTML='⚠ '+m;l.style.color='#fca5a5';}}
  setTimeout(function(){ if($('view').style.display==='none') fail('timed out — reload to retry'); },12000);
  if(!window.AETHYRO){ fail(window.AETHYRO_LOADERR||'app failed to load'); return; }
  var sb=window.AETHYRO.supabase, me=null, myname='member';
  var view=$('view');
  var esc=function(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
  var ago=function(t){var s=(Date.now()-new Date(t))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';};
  function show(){ $('loading').style.display='none'; view.style.display='block'; }

  (async function(){
    try{
      var ses=await sb.auth.getSession();
      if(!ses.data||!ses.data.session){ location.replace('./login.html'); return; }
      me=ses.data.session.user;
      myname=(me.email||'member').split('@')[0];
      try{ var pr=await sb.from('profiles').select('full_name').eq('id',me.id).single(); if(pr.data&&pr.data.full_name) myname=pr.data.full_name; }catch(e){}
      var params=new URLSearchParams(location.search);
      if(params.get('t')) await openThread(params.get('t')); else await listThreads('all');
      show();
    }catch(err){ fail((err&&err.message)||String(err)); }
  })();

  var CATS=['all','general','help','show','feedback','announcements'];
  async function listThreads(cat){
    var q=sb.from('forum_threads').select('*').order('last_activity',{ascending:false}).limit(50);
    if(cat&&cat!=='all') q=q.eq('category',cat);
    var r=await q; if(r.error) throw r.error;
    var html='<h1>Community</h1><p class="sub">Members-only. Be helpful, be real. Reports + rate-limits are on.</p>';
    html+='<div class="f-cats">'+CATS.map(function(c){return '<button class="f-cat'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>';}).join('')+'</div>';
    if(!r.data.length){ html+='<p class="muted">No threads yet — start the first one below.</p>'; }
    r.data.forEach(function(t){
      html+='<a class="f-thread" href="?t='+t.id+'"><div class="tt">'+esc(t.title)+'</div><div class="f-meta"><span class="f-pill">'+esc(t.category)+'</span><span>by '+esc(t.author||'member')+'</span><span>'+t.reply_count+' replies</span><span>'+ago(t.last_activity)+'</span></div></a>';
    });
    html+='<div class="f-form"><h3>Start a thread</h3>'
      +'<div class="row"><select id="ncat"><option value="general">general</option><option value="help">help</option><option value="show">show</option><option value="feedback">feedback</option></select><input id="ntitle" placeholder="Title" maxlength="160"/></div>'
      +'<textarea id="nbody" rows="4" placeholder="What\'s on your mind?" maxlength="8000"></textarea>'
      +'<div class="msg" id="nmsg"></div>'
      +'<button class="btn" id="ncreate" style="margin-top:.8rem">Post thread →</button></div>';
    view.innerHTML=html;
    view.querySelectorAll('.f-cat').forEach(function(b){ b.onclick=function(){ listThreads(b.dataset.c); }; });
    $('ncreate').onclick=createThread;
  }

  async function createThread(){
    var title=$('ntitle').value.trim(), body=$('nbody').value.trim(), cat=$('ncat').value;
    var m=$('nmsg');
    if(title.length<3||!body){ m.className='msg show err'; m.textContent='Add a title (3+ chars) and a body.'; return; }
    $('ncreate').disabled=true;
    var r=await sb.from('forum_threads').insert({user_id:me.id,author:myname,title:title,category:cat,body:body}).select().single();
    if(r.error){ m.className='msg show err'; m.textContent=r.error.message; $('ncreate').disabled=false; return; }
    location.href='?t='+r.data.id;
  }

  async function openThread(id){
    var tr=await sb.from('forum_threads').select('*').eq('id',id).single();
    if(tr.error){ view.innerHTML='<p class="muted">Thread not found. <a href="/app/community.html">Back</a></p>'; return; }
    var t=tr.data;
    var pr=await sb.from('forum_posts').select('*').eq('thread_id',id).order('created_at',{ascending:true});
    var posts=pr.data||[];
    var html='<a href="/app/community.html" style="font-size:.8rem">← all threads</a>';
    html+='<h1 style="margin-top:.6rem">'+esc(t.title)+'</h1>';
    html+='<div class="post"><span class="when">'+ago(t.created_at)+'</span><span class="who">'+esc(t.author||'member')+' · '+esc(t.category)+'</span><div class="bd">'+esc(t.body)+'</div>'+acts('thread',t.id,t.user_id)+'</div>';
    posts.forEach(function(p){ html+='<div class="post"><span class="when">'+ago(p.created_at)+'</span><span class="who">'+esc(p.author||'member')+'</span><div class="bd">'+esc(p.body)+'</div>'+acts('post',p.id,p.user_id)+'</div>'; });
    html+='<div class="f-form"><h3>Reply</h3><textarea id="rbody" rows="3" placeholder="Add a reply…" maxlength="8000"></textarea><div class="msg" id="rmsg"></div><button class="btn" id="rsend" style="margin-top:.8rem">Reply →</button></div>';
    view.innerHTML=html;
    $('rsend').onclick=function(){ reply(id); };
    bindActs();
  }
  function acts(kind,id,owner){
    var a='<div class="acts"><a data-report="'+kind+':'+id+'">report</a>';
    if(me&&owner===me.id) a+='<a data-del="'+kind+':'+id+'">delete</a>';
    return a+'</div>';
  }
  function bindActs(){
    view.querySelectorAll('[data-report]').forEach(function(el){ el.onclick=async function(){ var p=el.dataset.report.split(':'); await sb.from('forum_reports').insert({user_id:me.id,target_kind:p[0],target_id:p[1],reason:'flagged'}); el.textContent='reported'; el.style.color='var(--green)'; }; });
    view.querySelectorAll('[data-del]').forEach(function(el){ el.onclick=async function(){ var p=el.dataset.del.split(':'); if(!confirm('Delete this?'))return; await sb.from(p[0]==='thread'?'forum_threads':'forum_posts').delete().eq('id',p[1]); location.href = p[0]==='thread' ? '/app/community.html' : location.href; }; });
  }
  async function reply(threadId){
    var body=$('rbody').value.trim(), m=$('rmsg');
    if(!body){ m.className='msg show err'; m.textContent='Write something first.'; return; }
    $('rsend').disabled=true;
    var r=await sb.from('forum_posts').insert({thread_id:threadId,user_id:me.id,author:myname,body:body});
    if(r.error){ m.className='msg show err'; m.textContent=r.error.message; $('rsend').disabled=false; return; }
    location.reload();
  }
  $('signout').onclick=async function(){ await sb.auth.signOut(); location.href='./login.html'; };
})();
</script>
</body>
</html>
