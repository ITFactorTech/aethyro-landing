<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Forgot password — Aethyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./style.css"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
</head>
<body>
<div class="wrap">
  <a href="/" class="brand"><span class="dot"></span> Aethyro</a>
  <div class="card">
    <h1>Forgot password?</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email"/>
      <button class="btn" id="submit" type="submit">Send reset link →</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="alt"><a href="./login.html">← Back to log in</a></p>
  </div>
</div>
<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('submit'), form=document.getElementById('form');
  function show(t,kind){ msg.textContent=t; msg.className='msg show '+(kind||'err'); }
  if(!window.AETHYRO){ show(window.AETHYRO_LOADERR||'App failed to load.','err'); return; }
  var supabase=window.AETHYRO.supabase;
  form.addEventListener('submit', async function(e){
    e.preventDefault(); btn.disabled=true; btn.textContent='Sending…'; msg.className='msg';
    var email=document.getElementById('email').value.trim();
    var resetUrl=window.location.origin+'/app/reset.html';
    try{
      var r=await supabase.auth.resetPasswordForEmail(email, { redirectTo: resetUrl });
      if(r.error){ show(r.error.message,'err'); btn.disabled=false; btn.textContent='Send reset link →'; return; }
      show('Check your email — we sent a password reset link.','ok');
      btn.textContent='Email sent ✓';
    }catch(err){ show((err&&err.message)||String(err),'err'); btn.disabled=false; btn.textContent='Send reset link →'; }
  });
})();
</script>
</body>
</html>
