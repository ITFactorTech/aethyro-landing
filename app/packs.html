<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Prompt Packs — Aethyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./style.css"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BE319Z71PD"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-BE319Z71PD');</script>
<style>
  .pk-wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem}
  .pk{background:var(--s2);border:1px solid var(--b1);border-radius:14px;padding:1.4rem 1.5rem;margin-bottom:.7rem}
  .pk .h{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  .pk .t{font-weight:700;color:var(--text);font-size:1.02rem}
  .pk .s{color:var(--t2);font-size:.85rem;margin-top:.3rem;line-height:1.5}
  .pk .price{font-family:var(--mono);font-weight:800;color:var(--orange);white-space:nowrap}
  .pk .act{margin-top:.9rem;display:flex;gap:.6rem;align-items:center}
  .owned{font-family:var(--mono);font-size:.66rem;color:var(--green);border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.08);border-radius:5px;padding:.15rem .5rem;text-transform:uppercase}
  .pk-body{background:var(--s2);border:1px solid var(--b1);border-radius:14px;padding:2rem;white-space:pre-wrap;font-family:var(--mono);font-size:.82rem;line-height:1.7;color:var(--text)}
  .gate{background:rgba(255,77,0,.05);border:1px dashed rgba(255,77,0,.3);border-radius:14px;padding:2rem;text-align:center}
</style>
</head>
<body>
<div class="pk-wrap">
  <div class="topbar">
    <a href="/" class="brand" style="margin:0"><span class="dot"></span> Aethyro</a>
    <div style="display:flex;gap:.6rem"><a href="/app/dashboard.html" class="btn btn-ghost" style="width:auto;margin:0;padding:.5rem 1rem">Dashboard</a></div>
  </div>
  <div id="loading" class="loading">loading packs…</div>
  <div id="view" style="display:none"></div>
</div>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function fail(m){var l=$('loading');if(l){l.innerHTML='⚠ '+m;l.style.color='#fca5a5';}}
  setTimeout(function(){ if($('view').style.display==='none') fail('timed out — reload'); },12000);
  if(!window.AETHYRO){ fail(window.AETHYRO_LOADERR||'failed to load'); return; }
  var sb=window.AETHYRO.supabase, view=$('view'), me=null, owned={};
  var esc=function(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
  function show(){ $('loading').style.display='none'; view.style.display='block'; }

  (async function(){
    try{
      var ses=await sb.auth.getSession(); me=ses.data&&ses.data.session?ses.data.session.user:null;
      if(me){ var pr=await sb.from('purchases').select('product_key'); (pr.data||[]).forEach(function(p){owned[p.product_key]=true;}); }
      var p=new URLSearchParams(location.search).get('p');
      if(p) await openPack(p); else await listPacks();
      show();
    }catch(e){ fail((e&&e.message)||String(e)); }
  })();

  async function listPacks(){
    var r=await sb.rpc('pack_index'); if(r.error) throw r.error;
    var bought=new URLSearchParams(location.search).get('bought');
    var html='<h1>Prompt Packs</h1><p class="sub">Curated, role-specific prompts for your agents. Buy once, use forever.</p>';
    if(bought) html+='<div class="msg show ok">✓ Purchase complete — your pack is unlocked below.</div>';
    if(!me) html+='<p class="note">Log in to buy or view owned packs. <a href="/app/login.html">Log in →</a></p>';
    (r.data||[]).forEach(function(p){
      var price=p.is_free?'Free':'$'+(p.price_cents/100).toFixed(0);
      var isOwned=owned[p.pack_key]||p.is_free;
      html+='<div class="pk"><div class="h"><div><div class="t">'+esc(p.title)+'</div><div class="s">'+esc(p.summary||'')+'</div></div><div class="price">'+price+'</div></div><div class="act">';
      if(isOwned){ html+='<a class="btn btn-ghost" style="width:auto;margin:0;padding:.5rem 1rem" href="?p='+encodeURIComponent(p.pack_key)+'">Read →</a>'; if(owned[p.pack_key]&&!p.is_free) html+='<span class="owned">owned</span>'; }
      else { html+='<button class="btn" style="width:auto;margin:0;padding:.5rem 1.1rem" data-buy="'+p.pack_key+'">Buy '+price+' →</button>'; }
      html+='</div></div>';
    });
    view.innerHTML=html;
    view.querySelectorAll('[data-buy]').forEach(function(b){ b.onclick=function(){ buy(b.dataset.buy, b); }; });
  }

  async function buy(key, btn){
    if(!me){ location.href='/app/login.html'; return; }
    btn.disabled=true; btn.textContent='Starting checkout…';
    try{
      var r=await sb.functions.invoke('create-checkout',{ body:{ pack:key } });
      if(r.error) throw r.error;
      if(r.data&&r.data.url){ location.href=r.data.url; return; }
      throw new Error('no checkout url');
    }catch(e){ btn.disabled=false; btn.textContent='Try again'; alert('Checkout error: '+((e&&e.message)||e)); }
  }

  async function openPack(key){
    var r=await sb.from('pack_content').select('title,content,is_free').eq('pack_key',key).maybeSingle();
    var idx=await sb.rpc('pack_index'); var meta=(idx.data||[]).filter(function(x){return x.pack_key===key;})[0];
    var html='<a href="/app/packs.html" style="font-size:.8rem">← all packs</a>';
    if(r.data){
      html+='<h1 style="margin-top:.7rem">'+esc(r.data.title)+'</h1><div class="pk-body">'+esc(r.data.content)+'</div>';
    } else if(meta){
      html+='<h1 style="margin-top:.7rem">'+esc(meta.title)+'</h1><div class="gate"><div style="font-weight:700">🔒 '+('$'+(meta.price_cents/100).toFixed(0))+' — not yet purchased</div><p class="muted" style="margin:.6rem 0 1rem">'+esc(meta.summary||'')+'</p><button class="btn btn-orange" style="width:auto" id="gbuy">Buy this pack →</button></div>';
    } else { html+='<p class="muted" style="margin-top:1rem">Pack not found.</p>'; }
    view.innerHTML=html;
    var gb=$('gbuy'); if(gb) gb.onclick=function(){ buy(key, gb); };
  }
})();
</script>
</body>
</html>
